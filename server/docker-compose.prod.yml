# LiveKit for cast.nwdl.org on server.nwdl.org (~/apps/cast/docker-compose.yml), see README.md
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: cast-livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host # 10,000 UDP ports for media; publishing them through Docker would be slow
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging: # the log holds IP addresses; the privacy page promises a limited size
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
